[package]
name = "static-file-host"
version = "0.1.0"
edition = "2024"
license = "WTFPL"

[dependencies]
bytes = "1.12.1"
getrandom = "0.4.3"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
infer = "0.22.0"
mime_guess = "2.0.5"
multer = "3.1.0"
tokio = { version = "1.53.1", default-features = false, features = ["rt", "rt-multi-thread", "net", "fs", "io-util", "time"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
